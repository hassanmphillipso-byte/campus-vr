/* ?reset=1 自带清零：清光本机 campus 存档后摘掉参数进游戏 */
(function(){
  if(!/[?&]reset=1/.test(location.search))return;
  try{
    const removed=[];
    for(let i=localStorage.length-1;i>=0;i--){
      const k=localStorage.key(i);
      if(k&&k.startsWith('campus')){removed.push(k);localStorage.removeItem(k);}
    }
    console.log('[reset] 已清空',removed.length,'项存档');
  }catch(e){console.warn('[reset]',e);}
  history.replaceState(null,'',location.pathname);
})();

/* ============================================================
 * 阳光中学 3D 互动校园 —— 电脑优先 · 手机可玩（浏览器直开）
 *   输入：电脑 WASD+鼠标拖拽环视 / 手机双区触控（左摇杆 · 右环视）
 *   素材：Poly Haven(CC0) 天空HDRI+草地PBR / Kenney(CC0) 植被GLB
 *   尺度：1 单位 = 1 米
 * ============================================================ */

/* ---------- 种子随机（布局可复现） ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rng = mulberry32(20261005);
const rr = (min, max) => min + rng() * (max - min);

/* ---------- 渲染器 / 场景 / 相机 ---------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;        // r186 已移除 PCFSoftShadowMap
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9ec7ee);        // HDRI 失败时的兜底天空
scene.fog = new THREE.Fog(0x9ec7ee, 90, 220);        // 远处与天空融合

const camera = new THREE.PerspectiveCamera(72, innerWidth / innerHeight, 0.1, 400);
camera.rotation.order = 'YXZ';                       // 桌面 yaw/pitch 直改相机
camera.position.set(0, 1.65, 0);
/* ---------- 玩家 rig（位置/朝向载体，相机挂其上） ---------- */
const player = new THREE.Group();
player.position.set(-66, 0, -57);                      // 出生点：西门内主路
player.add(camera);
scene.add(player);
let yaw = -Math.PI / 2;                                // 桌面视角：朝东(+x)看向广场与田径场
camera.rotation.set(0, yaw, 0);

/* ============================================================
 * 素材加载（带进度条）
 * ============================================================ */
const el = {
  enter: document.getElementById('enter'), bar: document.getElementById('barIn'),
  msg: document.getElementById('loadMsg'), btn: document.getElementById('enterBtn'),
  tip: document.getElementById('slowTip'), hint: document.getElementById('hint'), fps: document.getElementById('fps'),
};
const manager = new THREE.LoadingManager();
/* 进度条按 loaded/total 比例驱动；文案在条数基础上追加已下载 MB（resource 条目 transferSize 累计，≥1s 节流防重排） */
try { performance.setResourceTimingBufferSize?.(2000); } catch {}
let loadBase = el.msg.textContent, loadMsgAt = 0;
const renderLoadMsg = () => {
  const now = performance.now();
  if (now - loadMsgAt < 1000) return;                    // 节流：每秒最多重绘一次文案
  loadMsgAt = now;
  let bytes = 0;
  for (const e of performance.getEntriesByType('resource')) bytes += e.transferSize || 0;
  el.msg.textContent = bytes > 0 ? `${loadBase} · 已下载 ${(bytes / 1048576).toFixed(1)} MB` : loadBase;
};
manager.onProgress = (_, loaded, total) => {
  el.bar.style.width = `${total > 0 ? Math.round(loaded / total * 100) : 0}%`;
  loadBase = `加载素材 ${loaded}/${total} …`;
  renderLoadMsg();
};
const mbTimer = setInterval(renderLoadMsg, 1000);        // 无条目完成时也每秒补一次 MB 数
/* 慢网引导：超 12 秒未就绪 → 柔和提示可先去精细教室（就绪后隐藏） */
const slowTimer = setTimeout(() => { el.tip.style.display = 'block'; }, 12000);
const texLoader = new THREE.TextureLoader(manager);
const gltfLoader = new GLTFLoader(manager);
const openSports = await new OpenSportsAssets(gltfLoader).load();
const loaded = { sky: false, grass: false, glb: 0 };
const playerFoley = new PlayerFoley({enabled:()=>campusMusic.masterOn});
window.__playerFoley = {state:()=>playerFoley.state()};
let playerAvatar = null;
let sportsExam = null;
/* 冷加载自愈：本地服务偶发连接被重置（GLB 并发冷启动），指数退避重试后再放弃 */
const retryAsync = async (fn, label, attempts = 3, baseMs = 500) => {
  for (let i = 0; ; i++) {
    try { return await fn(); }
    catch (e) {
      if (i >= attempts - 1) throw e;
      const ms = baseMs * 2 ** i;
      console.warn(`[load] ${label} 第${i + 1}次失败，${ms}ms 后重试`, e?.message || e);
      await new Promise(r => setTimeout(r, ms));
    }
  }
};
try { playerAvatar = await retryAsync(()=>PlayerAvatar.load({scene,camera,onFootstep:event=>playerFoley.step(event)}), '玩家身体'); }
catch(e) { console.warn('[player] 身体模型加载失败',e); }
window.__playerAvatar = {state:()=>playerAvatar?.state()??{ready:false}};

/* ---------- 天空 HDRI（Poly Haven kloofendal puresky, CC0） ---------- */
try {
  const hdr = await new HDRLoader(manager).loadAsync('assets/sky/campus_sky_2k.hdr');
  hdr.mapping = THREE.EquirectangularReflectionMapping;
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromEquirectangular(hdr).texture;
  scene.background = hdr;
  scene.backgroundBlurriness = 0.04;
  pmrem.dispose();
  loaded.sky = true;
} catch (e) { console.warn('[sky] HDRI 加载失败，使用纯色兜底', e); }

/* ---------- 草地 PBR 贴图（Poly Haven grass_ground, CC0） ---------- */
let grassMat;
try {
  const [diff, nor, rough] = await Promise.all([
    texLoader.loadAsync('assets/textures/grass_diff.jpg'),
    texLoader.loadAsync('assets/textures/grass_nor.jpg'),
    texLoader.loadAsync('assets/textures/grass_rough.jpg'),
  ]);
  for (const t of [diff, nor, rough]) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(30, 30); t.colorSpace = t === diff ? THREE.SRGBColorSpace : THREE.NoColorSpace; t.anisotropy = renderer.capabilities.getMaxAnisotropy(); }
  grassMat = new THREE.MeshStandardMaterial({ map: diff, normalMap: nor, roughnessMap: rough, roughness: 1, metalness: 0 });
  grassMat.normalScale.set(0.8, 0.8);
  loaded.grass = true;
} catch (e) { console.warn('[grass] 贴图加载失败，使用纯色兜底', e); grassMat = new THREE.MeshStandardMaterial({ color: 0x527a3a, roughness: 1 }); }

/* ---------- Kenney 植被 GLB（CC0）：按 Box3 归一化到目标真实米高 ---------- */
const KIT = 'assets/models/';
const proto = {};                                    // 名称 → 原型 Object3D
const GLB_FILES = [
  'tree_detailed.glb', 'tree_detailed_dark.glb', 'tree_tall_dark.glb', 'tree_cone_dark.glb',
  'tree_pineDefaultA.glb', 'tree_pineDefaultB.glb', 'tree_pineRoundB.glb', 'tree_thin_dark.glb',
  'rock_largeA.glb', 'rock_largeB.glb', 'rock_smallA.glb', 'rock_smallB.glb', 'rock_smallFlatA.glb',
  'flower_yellowA.glb', 'flower_redA.glb', 'flower_purpleA.glb', 'stump_round.glb', 'log.glb',
];
await Promise.all(GLB_FILES.map(async f => {
  try {
    const g = await gltfLoader.loadAsync(KIT + f);
    proto[f.replace('.glb', '')] = g.scene;
    loaded.glb++;
  } catch (e) { console.warn('[kit] 缺失素材，跳过：', f); }
}));

/* ---------- 中学生角色（Quaternius CC0 现代人物，Blender 校服配色，8 形象 × 12 动画） ---------- */
const CHAR_DIR = 'assets/characters_hs/';
const CHAR_FILES = ['Boy_A.glb', 'Boy_B.glb', 'Boy_C.glb', 'Girl_A.glb', 'Girl_B.glb', 'Girl_C.glb', 'Man_Teacher.glb', 'Woman_Teacher.glb'];
const charAssets = {};                               // 名 → { scene, clips: {name: clip} }
await Promise.all(CHAR_FILES.map(async f => {
  try {
    const g = await retryAsync(() => gltfLoader.loadAsync(CHAR_DIR + f), '角色 ' + f);
    const clips = {};
    for (const c of g.animations) clips[c.name] = c;
    charAssets[f.replace('.glb', '')] = { scene: g.scene, clips };
    loaded.glb++;
  } catch (e) { console.warn('[chars] 角色加载失败，NPC 将不可用：', f, e); }
}));
const TARGET_H = {                                   // 归一化目标高度（米）
  tree_detailed: 5.5, tree_detailed_dark: 5.5, tree_tall_dark: 7, tree_cone_dark: 6.5,
  tree_pineDefaultA: 6.5, tree_pineDefaultB: 6.5, tree_pineRoundB: 6, tree_thin_dark: 6,
  rock_largeA: 1.7, rock_largeB: 1.4, rock_smallA: 0.6, rock_smallB: 0.5, rock_smallFlatA: 0.35,
  flower_yellowA: 0.45, flower_redA: 0.45, flower_purpleA: 0.45, stump_round: 0.7, log: 0.5,
};
const _box = new THREE.Box3(), _sz = new THREE.Vector3();
function fitY(obj, targetH) {
  _box.setFromObject(obj); _box.getSize(_sz);
  if (_sz.y > 1e-4) obj.scale.multiplyScalar(targetH / _sz.y);
  _box.setFromObject(obj).getCenter(obj.position);
  obj.position.y = -_box.min.y;                      // 落地
  return obj;
}
/** 放置一个素材实例；素材缺失时用程序化低模兜底 */
function place(name, x, z, s = 1, ry = null) {
  const targetH = (TARGET_H[name] ?? 3) * s;
  let o;
  if (proto[name]) {
    o = proto[name].clone(true);
    fitY(o, targetH);
  } else {
    o = fallbackNature(name, targetH);
  }
  o.position.x = x; o.position.z = z;
  if (ry !== null) o.rotation.y = ry; else o.rotation.y = rng() * Math.PI * 2;
  o.traverse(m => { if (m.isMesh) { m.castShadow = true; } });
  const bb=new THREE.Box3().setFromObject(o), bounds={minX:bb.min.x,maxX:bb.max.x,minZ:bb.min.z,maxZ:bb.max.z};
  const excluded=landscapeConflicts(bounds);constructionLandscape[excluded?'excluded':'kept'].push({name,x,z,...bounds});
  if(!excluded)campus.add(o);
  return o;
}
function fallbackNature(name, h) {
  const g = new THREE.Group();
  if (name.startsWith('tree')) {
    g.add(new THREE.Mesh(new THREE.CylinderGeometry(0.14 * h, 0.2 * h, 0.42 * h, 7), trunkMat));
    const c = new THREE.Mesh(new THREE.ConeGeometry(0.34 * h, 0.68 * h, 8), leafMat);
    c.position.y = 0.55 * h; g.add(c);
    const c2 = new THREE.Mesh(new THREE.ConeGeometry(0.26 * h, 0.5 * h, 8), leafMat);
    c2.position.y = 0.78 * h; g.add(c2);
  } else if (name.startsWith('rock')) {
    const r = new THREE.Mesh(new THREE.IcosahedronGeometry(0.5 * h, 0), rockMat);
    r.position.y = 0.3 * h; g.add(r);
  } else if (name.startsWith('flower')) {
    const f = new THREE.Mesh(new THREE.SphereGeometry(0.3 * h, 6, 5), flowerMat);

{

  const zTop = G.z - G.width / 2, zBot = G.z + G.width / 2;

  seg(X, 0, Z * 2, false);                            // 东墙
  seg(0, -Z, X * 2, true);                            // 北墙

  for (const [cx, cz, len, alongX] of [[G.x, (-Z + zTop) / 2, zTop + Z, false], [G.x, (zBot + Z) / 2, Z - zBot, false], [X, 0, Z * 2, false], [0, -Z, X * 2, true], [0, Z, X * 2, true]]) {

function windowTexture(base, trim) {

    c.strokeRect(28 + fx * 80, 40 + fy * 108, 52, 70);

function buildCanteenInterior(cfg) {                     // 食堂室内装配：GLB 壳免碰撞后，由这里补墙体碰撞+台阶+家具灯光（壳=tools/gen_school.py 空心版）
  const { x, z, w: W, d: D } = cfg;
  const x0 = x - W / 2, x1 = x + W / 2, z0 = z - D / 2, z1 = z + D / 2, F = 0.45;   // F=台基面（与 GLB 台基环同高）
  // 墙体碰撞（对齐 GLB 0.5 厚壳墙：南面留 4m 门洞，与 mkFrame half=2.0 对齐）
  addBox(x0 + 0.25, z, 0.5, D);                         // 西
  addBox(x1 - 0.25, z, 0.5, D);                         // 东
  addBox(x, z0 + 0.25, W - 1.0, 0.5);                   // 北
  const gw = x - 2, ge = x + 2;
  addBox((x0 + gw) / 2, z1 - 0.25, gw - x0 - 0.5, 0.5); // 南两段
  addBox((ge + x1) / 2, z1 - 0.25, x1 - ge - 0.5, 0.5);
  // 走行面：室内地台 + 门口两级台阶（每级0.15，上得去下得来）
  platforms.push({ x0: x0 + 0.5, x1: x1 - 0.5, z0: z0 + 0.5, z1: z1 - 0.5, y: F });
  platforms.push({ x0: x - 2.2, x1: x + 2.2, z0: z1 - 0.5, z1: z1 + 0.2, y: F });          // 门槛
  platforms.push({ x0: x - 2.4, x1: x + 2.4, z0: z1 + 0.2, z1: z1 + 0.65, y: 0.30 });
  platforms.push({ x0: x - 2.6, x1: x + 2.6, z0: z1 + 0.65, z1: z1 + 1.1, y: 0.15 });
  const stepMat = new THREE.MeshStandardMaterial({ color: 0xcfc8b8, roughness: 1 });
  for (const [sw, sh, szc] of [[4.8, 0.30, z1 + 0.425], [5.6, 0.15, z1 + 0.875]]) {
    const st = new THREE.Mesh(new THREE.BoxGeometry(sw, sh, 0.45), stepMat);
    st.position.set(x, sh / 2, szc); st.receiveShadow = true; campus.add(st);
  }
  // 地砖（室内 F+0.01）
  const fc = document.createElement('canvas'); fc.width = fc.height = 256; const g2 = fc.getContext('2d');
  g2.fillStyle = '#d9d2c0'; g2.fillRect(0, 0, 256, 256);
  g2.strokeStyle = 'rgba(120,110,90,.38)'; g2.lineWidth = 3;
  for (let i = 0; i <= 2; i++) { g2.beginPath(); g2.moveTo(i * 128, 0); g2.lineTo(i * 128, 256); g2.stroke(); g2.beginPath(); g2.moveTo(0, i * 128); g2.lineTo(256, i * 128); g2.stroke(); }
  const floorTex = new THREE.CanvasTexture(fc); floorTex.colorSpace = THREE.SRGBColorSpace; floorTex.wrapS = floorTex.wrapT = THREE.RepeatWrapping; floorTex.repeat.set(5, 3);
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(W - 1.0, D - 1.0), new THREE.MeshStandardMaterial({ map: floorTex, roughness: 0.9 }));

/* ============================================================
 * 空心楼走行系统：platforms（楼板/外廊）+ ramps（楼梯踏步）+ 逐层墙碰撞
 * 与 gen_school.py 共享公式：层底=0.3+f*3.3，楼梯区 sA=L/2-7.3，每跑9级0.183m
 * ============================================================ */
const platforms = [];                                  // {x0,x1,z0,z1,y} 走行面
const rampSteps = [];                                  // {x0,x1,cz,yb,h} 单级踏步（Rapier 用）
function buildInterior(xc, zc, L, W) {
  const FH = 3.3, FLOORS = 4, GRD = 0.45;
  const xi0 = xc - W / 2 + 0.5, xi1 = xc + W / 2 - 0.5;
  const zHalf = L / 2 - 0.5, z0 = zc - zHalf, z1 = zc + zHalf;
  const sA = zc + L / 2 - 7.3, sx1 = xi0 + 2.2;
  const addBoxY = (cx, cz, w, d, y0, y1) => collide.push({ minX: cx - w / 2, maxX: cx + w / 2, minZ: cz - d / 2, maxZ: cz + d / 2, y0, y1 });
  // 楼板（ground=台基面；2~4层+屋顶绕楼梯洞分段）
  platforms.push({ x0: xi0, x1: xi1, z0, z1, y: GRD });
  for (let lv = 1; lv <= FLOORS; lv++) {
    const y = 0.3 + lv * FH;
    platforms.push({ x0: xi0, x1: xi1, z0, z1: sA - 3.35, y });              // 主段
    platforms.push({ x0: sx1, x1: xi1, z0: sA - 3.35, z1: sA - 1.1, y });    // 洞右段
    platforms.push({ x0: xi0, x1: xi1, z0: sA - 1.1, z1: z1, y });           // 口台+南段
    platforms.push({ x0: xc + W / 2 - 2.0, x1: xc + W / 2 + 0.55, z0: z0 - 0.3, z1: z1 + 0.3, y: 0.3 + lv * FH + 0.15 });  // 外廊条（覆盖挑板宽2.4）
  }
  // 楼梯：每层 2 跑 × 9 级 + 半台
  const rise = FH / 2 / 9;
  for (let f = 0; f < FLOORS; f++) {
    const yb = 0.3 + f * FH;
    for (let i = 1; i <= 9; i++) {                                           // 跑1（西列，向北上行）
      rampSteps.push({ x0: xi0, x1: xi0 + 1.1, cz: sA - 0.125 - (i - 1) * 0.25, yb, h: rise * i });
    }
    platforms.push({ x0: xi0, x1: sx1, z0: sA - 3.35, z1: sA - 2.25, y: yb + FH / 2 });   // 半台
    for (let i = 1; i <= 9; i++) {                                           // 跑2（东列，折返上行）
      rampSteps.push({ x0: xi0 + 1.1, x1: sx1, cz: sA - 3.35 + 0.125 + (i - 1) * 0.25, yb: yb + FH / 2, h: rise * i });
    }
  }
  // 走行辅助：把每跑折算成两条斜坡判定（线性高度，脚感平滑）
  const ramps = window.__ramps = (window.__ramps || []);
  for (let f = 0; f < FLOORS; f++) {
    const yb = 0.3 + f * FH;
    ramps.push({ x0: xi0, x1: xi0 + 1.1, z0: sA - 2.25, z1: sA, y0: yb + 1.65, y1: yb + rise });            // 跑1坡
    ramps.push({ x0: xi0 + 1.1, x1: sx1, z0: sA - 3.35, z1: sA - 1.1, y0: yb + 1.65 + rise, y1: yb + 3.3 }); // 跑2坡
  }
  // 教室元素：每层东墙黑板 + 两列课桌椅（真实小教室，无碰撞可穿行观赏）
  const deskTop = new THREE.MeshStandardMaterial({ color: 0xc99e6a, roughness: 0.8 });
  const deskLeg = new THREE.MeshStandardMaterial({ color: 0x5a6068, roughness: 0.7 });
  const boardM = new THREE.MeshStandardMaterial({ color: 0x27443a, roughness: 0.9 });
  const addM = (geo, mat, x, y, z) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = true; campus.add(m); };
  for (let f = 0; f < FLOORS; f++) {
    const yb = f === 0 ? GRD : 0.3 + f * FH;
    addM(new THREE.BoxGeometry(0.05, 1.15, 3.2), boardM, xi1 - 0.08, yb + 1.55, zc - 11.5);   // 黑板
    addM(new THREE.BoxGeometry(0.09, 0.08, 3.3), deskLeg, xi1 - 0.08, yb + 2.2, zc - 11.5);   // 粉笔槽
    for (let r = 0; r < 3; r++) for (let c = 0; c < 2; c++) {
      const dx = xi0 + 2.4 + c * 1.9, dz = zc - 14.5 + r * 1.55;
      addM(new THREE.BoxGeometry(0.62, 0.035, 0.45), deskTop, dx, yb + 0.73, dz);             // 桌面
      for (const lx of [-0.26, 0.26]) addM(new THREE.BoxGeometry(0.045, 0.72, 0.38), deskLeg, dx + lx, yb + 0.36, dz);
      addM(new THREE.BoxGeometry(0.34, 0.032, 0.26), deskTop, dx, yb + 0.44, dz + 0.62);      // 凳面
      addM(new THREE.BoxGeometry(0.06, 0.43, 0.18), deskLeg, dx, yb + 0.22, dz + 0.62);
    }
  }
  // 墙体碰撞（逐层带高度，玩家/NPC 分层阻挡）
  // ★ 教室门缝：PY_LEVELS 的三关教室门都在东墙中段（视觉有门洞），碰撞必须同步开门，否则真人进不去（传送不受碰撞、测不出）
  const doorGaps = (window.PY_LEVELS || [])
    .map(l => l.door).filter(Array.isArray)
    .filter(d => Math.abs(d[0] - (xc + W / 2 - 0.25)) < 1.5 && d[1] >= zc - L / 2 && d[1] <= zc + L / 2)
    .map(d => [d[1] - 1.7, d[1] + 1.7]);
  for (let f = 0; f < FLOORS; f++) {
    const y0 = 0.3 + f * FH, y1 = y0 + FH;
    addBoxY(xc - W / 2 + 0.25, zc, 0.5, L, y0, y1);                          // 西墙
    addBoxY(xc, zc - L / 2 + 0.25, W - 1, 0.5, y0, y1);                      // 北墙
    if (f === 0) {                                                            // 南墙 ground：门洞3m
      const segS = (W - 1 - 3) / 2;
      for (const s of [-1, 1]) addBoxY(xc + s * (3 + segS) / 2, zc + L / 2 - 0.25, segS, 0.5, 0, y1 + 0.6);
    } else addBoxY(xc, zc + L / 2 - 0.25, W - 1, 0.5, y0, y1);              // 南墙上层
    const e = (L - 1) / 2, h1 = zc - L / 2 + 8, h2 = zc + L / 2 - 8, hw = 1.5;   // 东墙：每层2门洞通外廊
    const gaps = f === 0
      ? [[h1 - hw, h1 + hw], [h2 - hw, h2 + hw], ...doorGaps]                 // 一层叠加教室门缝
      : [[h1 - hw, h1 + hw], [h2 - hw, h2 + hw]];
    // 门洞只属于本栋楼；再次裁剪边界，防止远处教室门把墙体延伸到校园主路。
    const boundedGaps = gaps.map(([a, b]) => [Math.max(a, zc - e), Math.min(b, zc + e)])
      .filter(([a, b]) => a < b).sort((a, b) => a[0] - b[0]);
    let wallZ = zc - e;
    for (const [g0, g1] of boundedGaps) {                                            // 门缝之间逐段砌墙
      if (g0 - wallZ > 0.2) addBoxY(xc + W / 2 - 0.25, (wallZ + g0) / 2, 0.5, g0 - wallZ, y0, y1);
      wallZ = Math.max(wallZ, g1);
    }
    if (zc + e - wallZ > 0.2) addBoxY(xc + W / 2 - 0.25, (wallZ + zc + e) / 2, 0.5, zc + e - wallZ, y0, y1);
  }
}
function groundY(x, z, curY) {
  let g = 0;
  for (const p of platforms) if (x > p.x0 && x < p.x1 && z > p.z0 && z < p.z1 && p.y <= curY + 0.55) g = Math.max(g, p.y);
  for (const r of (window.__ramps || []))
    if (x > r.x0 && x < r.x1 && z > r.z0 && z < r.z1) {
      const h = r.y0 + (z - r.z0) / (r.z1 - r.z0) * (r.y1 - r.y0);
      if (h <= curY + 0.55) g = Math.max(g, h);
    }
  return g;
}

}

/* ---------- 田径场（300m 跑道 = 两直道 + 两半圆弯 · 内场蓝塑胶跳绳盘，照实拍照片） ---------- */
let TRACK_PATH = null;                                  // 跑道中线 polyline（NPC 跑步/散步共用）
let trackSurfaceMaterial=null;
{
  const T = LAYOUT.sports.track;
  const rMid = (T.rIn + T.rOut) / 2, L = T.straight / 2;
  // —— 跑道底面（红塑胶）：外轮廓挖内轮廓的环形 Shape ——
  const ovalPath = (r) => {
    const p = new THREE.Path();
    p.moveTo(T.x - r, T.z + L);
    p.lineTo(T.x - r, T.z - L);
    p.absarc(T.x, T.z - L, r, Math.PI, Math.PI * 2, false);   // 北弯（经 3π/2 正北凸出）
    p.lineTo(T.x + r, T.z + L);
    p.absarc(T.x, T.z + L, r, 0, Math.PI, false);             // 南弯（经 π/2 正南凸出）
    p.closePath();
    return p;
  };
  {
    const shape = new THREE.Shape(ovalPath(T.rOut).getPoints(96));
    shape.holes.push(new THREE.Path(ovalPath(T.rIn).getPoints(96).reverse()));
    const trackGeo = new THREE.ShapeGeometry(shape, 48);
    trackGeo.rotateX(-Math.PI / 2);
    // XY -> XZ rotation negates the path's Y coordinate. The oval is symmetric;
    // offset its mirrored centre back to the same Z used by routes and goals.
    trackGeo.translate(0,0,2*T.z);
    trackSurfaceMaterial=new THREE.MeshStandardMaterial({ color: 0xb4443f, roughness: 1 });
    const track = new THREE.Mesh(trackGeo,trackSurfaceMaterial);
    track.position.y = 0.026; track.receiveShadow = true; campus.add(track);
  }
  // —— 分道白线（3 条细环，6 分道） ——
  for (const r of [rMid - 3.2 + 1.2, rMid - 1.3, rMid + 0.7]) {
    const shape = new THREE.Shape(ovalPath(r).getPoints(96));
    shape.holes.push(new THREE.Path(ovalPath(r - 0.12).getPoints(96).reverse()));
    const g = new THREE.ShapeGeometry(shape, 48); g.rotateX(-Math.PI / 2);g.translate(0,0,2*T.z);
    const m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ color: 0xf2efe8, roughness: 1 }));
    m.position.y = 0.03; campus.add(m);
  }
  // —— 内场：蓝塑胶 + 标准足球场白线（中圈兼跳绳轮转盘，照无人机照片+用户需求） ——
  {
    const shape = new THREE.Shape(ovalPath(T.rIn - 0.5).getPoints(96));
    const g = new THREE.ShapeGeometry(shape, 48); g.rotateX(-Math.PI / 2);g.translate(0,0,2*T.z);
    const cv = document.createElement('canvas'); cv.width = 512; cv.height = 860;
    const c = cv.getContext('2d');
    c.fillStyle = '#2f66ad'; c.fillRect(0, 0, 512, 860);                       // 蓝塑胶
    // 世界→画布（内场包络 x:[13.5,62.5] z:[-39,69]）
    const X = wx => (wx - 13.5) / 49 * 512, Y = wz => (wz + 39) / 108 * 860;
    const SX = m => m / 49 * 512, SY = m => m / 108 * 860;
    c.strokeStyle = '#f2efe8'; c.fillStyle = '#f2efe8'; c.lineWidth = 5;
    // 边界线 + 球场（44 × 92，中心 38,15）
    c.strokeRect(X(38 - 22), Y(15 - 46), SX(44), SY(92));
    c.beginPath(); c.moveTo(X(38 - 22), Y(15)); c.lineTo(X(38 + 22), Y(15)); c.stroke();   // 中线
    c.beginPath(); c.ellipse(X(38), Y(15), SX(9.15), SY(9.15), 0, 0, Math.PI * 2); c.stroke();  // 中圈
    c.beginPath(); c.arc(X(38), Y(15), 6, 0, Math.PI * 2); c.fill();           // 中点
    for (let i = 0; i < 12; i++) {                                             // 中圈 12 放射线（跳绳轮转盘）
      const a = i * Math.PI / 6;
      c.beginPath(); c.moveTo(X(38) + Math.cos(a) * SX(9.15) * 0.55, Y(15) + Math.sin(a) * SY(9.15) * 0.55);
      c.lineTo(X(38) + Math.cos(a) * SX(9.15), Y(15) + Math.sin(a) * SY(9.15)); c.stroke();
    }
    for (const s of [-1, 1]) {                                                 // 两端禁区/小禁区/点球点/角旗弧
      const gz = 15 + s * 46;
      c.strokeRect(X(38 - 20.16), Math.min(Y(gz), Y(gz - s * 16.5)), SX(40.32), SY(16.5));   // 禁止区域
      c.strokeRect(X(38 - 9.16), Math.min(Y(gz), Y(gz - s * 5.5)), SX(18.32), SY(5.5));       // 球门区
      c.beginPath(); c.arc(X(38), Y(gz - s * 11), 5, 0, Math.PI * 2); c.fill();               // 罚球点
      c.beginPath(); c.ellipse(X(38), Y(gz - s * 11), SX(9.15) * 0.42, SY(4) * 0.9, 0,
        s > 0 ? Math.PI * 0.55 : -Math.PI * 0.45, s > 0 ? Math.PI * 1.45 : Math.PI * 0.45); c.stroke(); // 罚球弧
      for (const cx of [38 - 22, 38 + 22]) {                                   // 角旗弧
        c.beginPath(); c.arc(X(cx), Y(gz), SX(1), 0, Math.PI * 2); c.stroke();
      }
    }
    const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace;
    const rI = T.rIn - 0.5, W = rI * 2, H = T.straight + rI * 2;             // 内场外沿包络（=UV 坐标跨度）
    tex.repeat.set(1 / W, 1 / H);
    tex.offset.set(-(T.x - rI) / W, -(T.z - L - rI) / H);                    // ShapeGeometry 的 UV=世界xz坐标，offset 对齐包围盒
    tex.wrapS = tex.wrapT = THREE.ClampToEdgeWrapping;
    const m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ map: tex, roughness: 0.95 }));
    m.position.y = 0.028; m.receiveShadow = true; campus.add(m);
  }
  // —— 终点线（西直道中段） ——
  flat(new THREE.PlaneGeometry(0.35, T.rOut - T.rIn), new THREE.MeshStandardMaterial({ color: 0xf2efe8, roughness: 1 }), T.x - rMid, T.z - 6, 0.034);
  // —— 跑道中线 polyline（供 NPC 沿真实跑道跑） ——
  {
    const pts = [];
    const N1 = 70, N2 = 30;
    for (let i = 0; i <= N1; i++) pts.push([T.x - rMid, T.z - L + T.straight * i / N1]);   // 西直道（北→南）
    for (let i = 0; i <= N2; i++) { const a = Math.PI - Math.PI * i / N2; pts.push([T.x + rMid * Math.cos(a), T.z + L + rMid * Math.sin(a)]); }  // 南弯
    for (let i = 0; i <= N1; i++) pts.push([T.x + rMid, T.z + L - T.straight * i / N1]);   // 东直道（南→北）
    for (let i = 0; i <= N2; i++) { const a = -Math.PI * i / N2; pts.push([T.x + rMid * Math.cos(a), T.z - L + rMid * Math.sin(a)]); }          // 北弯
    let perim = 0; const acc = [0];
    for (let i = 1; i < pts.length; i++) { perim += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); acc.push(perim); }
    TRACK_PATH = { pts, acc, perim };
  }
  label('田径场 · 足球场', T.x, 3.2, T.z, 11);
  // —— 主席台（跑道北侧，照卫星图） ——
  {
    const R = LAYOUT.sports.rostrum;
    const base = new THREE.Mesh(new THREE.BoxGeometry(R.w, R.h, R.d), new THREE.MeshStandardMaterial({ color: 0xb9b2a6, roughness: 1 }));
    base.position.set(R.x, R.h / 2, R.z); base.castShadow = base.receiveShadow = true; campus.add(base);
    const back = new THREE.Mesh(new THREE.BoxGeometry(R.w + 1, 3.4, 0.3), new THREE.MeshStandardMaterial({ color: 0x6d7680, roughness: 0.9 }));
    back.position.set(R.x, R.h + 1.7, R.z - R.d / 2); back.castShadow = true; campus.add(back);
    const roof = new THREE.Mesh(new THREE.BoxGeometry(R.w + 2, 0.25, R.d + 1.4), new THREE.MeshStandardMaterial({ color: 0x8d939c, roughness: 0.8 }));
    roof.position.set(R.x, R.h + 3.4, R.z); roof.castShadow = true; campus.add(roof);
    addBox(R.x, R.z, R.w, R.d);
    label('主席台', R.x, 5.4, R.z, 7);
  }
}

function label(text, x, y, z, w = 8) {

  const c = cv.getContext('2d');
  c.font = 'bold 68px "PingFang SC",sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
  c.shadowColor = 'rgba(0,0,0,.65)'; c.shadowBlur = 14;
  c.fillStyle = '#fff'; c.fillText(text, 256, 66);
  const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: true }));
  sp.position.set(x, y, z); sp.scale.set(w, w / 4, 1);
  labelSprites.push({ sp, w });
  campus.add(sp);
}

/* ---------- ★ 真实建模接收端：Blender 导出的 glb 楼宇自动装载 ----------
 * 在 LAYOUT.glbBuildings 登记即可：高度归一化 → 落地 → 自动 AABB 碰撞体 → 可选悬浮标牌
 * （会一并进入静态合并与烘焙阴影，不增加后续渲染负担） */
async function loadGlbBuilding(g) {
  try {
    const gltf = await retryAsync(() => gltfLoader.loadAsync(g.url), '教学楼GLB ' + (g.label || g.url));
    const wrap = new THREE.Group();
    const o = gltf.scene;
    o.rotation.y = g.ry ?? 0;
    wrap.add(o);
    if (g.height) {                                    // 按目标米高归一化（不赌建模原始单位）
      const bb = new THREE.Box3().setFromObject(o);
      const h = bb.max.y - bb.min.y;
      if (h > 1e-4) o.scale.setScalar(g.height / h);
    } else o.scale.setScalar(g.scale ?? 1);
    const bb = new THREE.Box3().setFromObject(o);      // 居中 + 落地
    const ctr = bb.getCenter(new THREE.Vector3());
    o.position.x -= ctr.x; o.position.z -= ctr.z; o.position.y -= bb.min.y;
    wrap.position.set(g.x, 0, g.z);
    o.traverse(m => { if (m.isMesh) { m.castShadow = m.receiveShadow = true; } });
    campus.add(wrap);
    const bbw = new THREE.Box3().setFromObject(wrap);  // 模型包围盒即碰撞体（空心楼用 noCollider 跳过，改由 buildInterior 逐层生成）
    if (!g.noCollider) collide.push({ minX: bbw.min.x, maxX: bbw.max.x, minZ: bbw.min.z, maxZ: bbw.max.z });
    if (g.label) label(g.label, g.x, (bbw.max.y - bbw.min.y) + 2.2, g.z, g.labelW ?? 9);
    console.info('[glbBuilding] 已装载：', g.url, `(${(bbw.max.x - bbw.min.x).toFixed(1)}×${(bbw.max.y - bbw.min.y).toFixed(1)}×${(bbw.max.z - bbw.min.z).toFixed(1)}m)`);
    return true;
  } catch (e) { console.warn('[glbBuilding] 加载失败（该楼将缺席）：', g.url, e); return false; }
}
for (const g of LAYOUT.glbBuildings ?? []) await loadGlbBuilding(g);

/* ---------- 各活动区域的路径点生成 ---------- */
function trackPoint(s) {                               // 跑道中线上按弧长取点（s 米）
  const TP = TRACK_PATH;
  s = ((s % TP.perim) + TP.perim) % TP.perim;
  let lo = 0, hi = TP.acc.length - 1;
  while (lo < hi) { const mid = (lo + hi) >> 1; TP.acc[mid] < s ? lo = mid + 1 : hi = mid; }
  const i = Math.max(1, lo);
  const t0 = TP.acc[i - 1], t1 = TP.acc[i];
  const k = t1 > t0 ? (s - t0) / (t1 - t0) : 0;
  return { x: TP.pts[i - 1][0] + (TP.pts[i][0] - TP.pts[i - 1][0]) * k, z: TP.pts[i - 1][1] + (TP.pts[i][1] - TP.pts[i - 1][1]) * k };
}

/* ---------- 头顶气泡（canvas Sprite，走近显示，typewriter） ---------- */
function drawBubble(npc) {
  if (!npc.bubbleCv) {
    npc.bubbleCv = document.createElement('canvas');
    npc.bubbleCv.width = 512; npc.bubbleCv.height = 224;
    npc.bubbleTex.image = npc.bubbleCv;             // 换成独立画布
  }
  const c = npc.bubbleCv.getContext('2d');
  c.clearRect(0, 0, 512, 224);
  const shown = npc.line.slice(0, npc.typed);
  c.fillStyle = npc.talkColor || '#3d7bff';
  c.beginPath(); c.roundRect(10, 10, 492, 204, 26); c.fill();
  c.fillStyle = 'rgba(12,18,32,.88)';
  c.beginPath(); c.roundRect(16, 16, 480, 192, 22); c.fill();
  c.beginPath(); c.moveTo(236, 208); c.lineTo(276, 208); c.lineTo(256, 224); c.fill();
  c.fillStyle = npc.talkColor || '#3d7bff';
  c.font = 'bold 34px "PingFang SC",sans-serif'; c.textAlign = 'left'; c.textBaseline = 'top';
  c.fillText(`${npc.n} · ${npc.g} · ${npc.r}`, 34, 34);
  c.fillStyle = '#fff'; c.font = '30px "PingFang SC",sans-serif';
  // 简单换行（每行 ~16 字）
  for (let i = 0, y = 86; i < 3; i++, y += 42) {
    const seg = shown.slice(i * 16, (i + 1) * 16);
    if (seg) c.fillText(seg, 34, y);
  }
  npc.bubbleTex.needsUpdate = true;
}

/* ---------- 角色骨骼：自然待机、环顾与交谈点头 ---------- */
function findBones(obj) {                                // KayKit 命名：upperarml/upperarmr/lowerarm…/upperlegl（小写尾缀 l/r）
  const B = {};
  obj.traverse(o => {
    if (!o.isBone) return;
    const n = o.name;
    if (!window.__bonesDumped) console.info('[bone]', n);
    if (/^(control|IK|heel|knee|elbow|handIK|toe)/i.test(n)) return;   // IK/控制骨不驱动
    const lo = n.toLowerCase();
    const L = /l$/.test(lo), R = /r$/.test(lo);
    if (/lowerarm|forearm/.test(lo)) { if (L) B.lFore = o; if (R) B.rFore = o; return; }
    if (/palm|^hand/.test(lo)) { if (L) B.lHand = o; if (R) B.rHand = o; return; }   // 道具绑骨目标（球拍/绳柄）
    if (/upperarm|^arm/.test(lo)) { if (L) B.lArm = o; if (R) B.rArm = o; return; }
    if (/^hips|pelvis/.test(lo)) { B.hips = o; return; }

    npc.obj.rotation.y += angleDelta(Math.atan2(dx, dz),npc.obj.rotation.y)*(1-Math.exp(-dt*8));
    npc.navigation?.pause();         // 原始模型脸朝 +z，atan2(dx,dz) 正对玩家

    playClip(npc, 'Idle');
    return;
  }
  // 台词轮换 + 气泡打字机
  npc.talkT -= dt;
  if (npc.talkT <= 0) { npc.lineIdx = (npc.lineIdx + 1) % npc.lines.length; npc.line = npc.lines[npc.lineIdx]; npc.typed = 0; npc.talkT = rr(6, 10); }
  const dPlayer = Math.hypot(player.position.x - pos.x, player.position.z - pos.z);
  const wantBubble = dPlayer < 8;
  if (wantBubble) {
    if (!npc.bubbleOn) { npc.bubbleOn = true; npc.bubble.visible = true; npc.typed = 0; }
    const full = npc.line.length;
    if (npc.typed < full) { npc.typed = Math.min(full, npc.typed + dt * 14); drawBubble(npc); }
  } else if (npc.bubbleOn) { npc.bubbleOn = false; npc.bubble.visible = false; }
  // 距离分级投影（省阴影 pass：18m 外 NPC 不投影）
  const shadowNear=dPlayer<18;
  if(npc.shadowNear!==shadowNear){npc.shadowNear=shadowNear;frameWork.shadowChanges++;npc.obj.traverse(o=>{if(o.isMesh)o.castShadow=shadowNear;});}

  if (npc.b === 'sitChair' || npc.b === 'sitFloor') return;
  const activity = npc.activity;
  if(activity.profile==='freestyle'||activity.profile==='breaststroke'){
    if(npc.swDirection===undefined)npc.swDirection=activity.profile==='freestyle'?1:-1;
    if(activity.kind!=='float-rest')pos.x+=npc.swDirection*(activity.profile==='freestyle'?.72:.52)*dt;
    if(pos.x>-11.0){pos.x=-11.0;npc.swDirection=-1;}
    if(pos.x<-26.0){pos.x=-26.0;npc.swDirection=1;}
    pos.y=.08; npc.obj.rotation.order='YXZ';
    const wanted=npc.swDirection*Math.PI/2;let diff=wanted-npc.obj.rotation.y;
    while(diff>Math.PI)diff-=Math.PI*2;while(diff<-Math.PI)diff+=Math.PI*2;
    npc.obj.rotation.set(Math.PI/2,npc.obj.rotation.y+diff*Math.min(1,dt*4),0);
    playClip(npc,'Idle');return;
  }
  if(activity.profile==='goalkeeper'){
    if(activity.kind==='side-step'){
      const target=38+Math.sin(activity.localTime/4*Math.PI*2)*1.1,delta=target-pos.x;
      pos.x+=Math.max(-dt*.85,Math.min(dt*.85,delta));
      npc.obj.rotation.y=delta>0?Math.PI/2:-Math.PI/2;playClip(npc,'Walking_A');
    }else{npc.obj.rotation.y=0;playClip(npc,'Idle');}
    return;
  }
  if(['skipping','rope-setup'].includes(activity.profile))pos.y=activity.kind==='skip'?Math.max(0,Math.sin(activity.localTime*9))*.08:0;
  if(!activity.moving)npc.navigation?.pause();
  if(!activity.moving && npc.b!=='mocap' && !(npc.b==='footballer'&&activity.kind==='pass-ready')){playClip(npc,'Idle');return;}
   // 固定座：只播坐姿动画
  if (npc.b === 'footballer') {                                // 足球学生：走动 + 球滚近自动回传中圈
    for (const b of balls) {
      if (!b.socr || b.held || b.penaltyLock) continue;
      if(b.mesh.position.x<20||b.mesh.position.x>56||b.mesh.position.z< -20||b.mesh.position.z>45)continue;
      const d = Math.hypot(pos.x - b.mesh.position.x, pos.z - b.mesh.position.z);
      if (activity.kind==='pass-ready' && d < 1.15 && d > .25 && (npc.nextPass||0)<=t) {
        const teammate=npcs.find(p=>p.b==='footballer'&&p!==npc);
        const dx = (teammate?.obj.position.x||38) - b.mesh.position.x, dz = (teammate?.obj.position.z||15) - b.mesh.position.z, L = Math.hypot(dx, dz) || 1;
        npc.nextPass=t+3;
        kickBall(b, dx / L, dz / L, rr(1.8, 2.6));
        npc.kickAnim = 0.3;
        npc.obj.rotation.y = Math.atan2(b.mesh.position.x - pos.x, b.mesh.position.z - pos.z);
        break;
      }
    }
    if(activity.kind==='pass-ready'){
      const ball=balls.filter(b=>b.socr&&!b.held&&!b.penaltyLock&&b.mesh.position.x>=20&&b.mesh.position.x<=56&&b.mesh.position.z>= -20&&b.mesh.position.z<=45).sort((a,b)=>pos.distanceTo(a.mesh.position)-pos.distanceTo(b.mesh.position))[0];
      if(ball){const d=Math.hypot(pos.x-ball.mesh.position.x,pos.z-ball.mesh.position.z);
        if(d<1.0){playClip(npc,'Idle');return;}
        npc.target={x:ball.mesh.position.x,z:ball.mesh.position.z};npc.state='walk';
      }
    }
  }
  if (npc.b === 'run') {                                       // 沿真实跑道 polyline 跑（逆时针）
    if (!TRACK_PATH) return;
    if (npc.tp === undefined) npc.tp = rng() * TRACK_PATH.perim;
    const v = npc.rv ?? (npc.rv = rr(2.2, 2.9));               // 各人配速
    npc.tp += v * dt;
    const p = trackPoint(npc.tp), p2 = trackPoint(npc.tp + 0.8);
    if (!npcBlocked(p.x, p.z)) { pos.x = p.x; pos.z = p.z; }
    const vx = p2.x - p.x, vz = p2.z - p.z;
    if (Math.hypot(vx, vz) > 1e-4) npc.obj.rotation.y = Math.atan2(-vx, -vz) + MODEL_YAW;
    playClip(npc, 'Running_A');
    return;
  }
  if (npc.b === 'mocap') {                             // 动捕展示队：循环播放用户录制的动作
    npc.obj.rotation.y = Math.PI;
    playClip(npc, 'MOCAP');
    return;
  }
  // 走路型
  if (npc.state === 'idle') {
    playClip(npc, 'Idle');
    npc.idleT -= dt;
    if (npc.idleT <= 0) {
      for(let attempt=0;attempt<30;attempt++){
        const target=ZONES[npc.z]();if(!npcBlocked(target.x,target.z)){npc.target=target;break;}
      }
      if(!npc.target){npc.idleT=1;return;}
      npc.state = 'walk';
      playClip(npc, npc.walking || (npc.walking = ['Walking_A', 'Walking_B', 'Walking_C'][(rng() * 3) | 0]));
    }
    return;
  }
  // Follow cached collision-checked waypoints and slow before turning/arriving.
  npc.navigation ||= new CharacterNavigator();
  const motion=npc.navigation.update(pos,npc.target,npc.obj.rotation.y,dt,
    npc.r.includes('老师')||npc.r.includes('保洁')?.85:1.15,npcBlocked,player.position);
  pos.x=motion.x;pos.z=motion.z;npc.obj.rotation.y=motion.yaw;
  if(motion.status==='arrived'||motion.status==='unreachable'){
    npc.state='idle';npc.idleT=motion.status==='arrived'?rr(4,10):1.5;npc.target=null;
  }
  const walking=motion.speed>.08;
  playClip(npc,walking?(npc.walking||'Walking_A'):'Idle');
  npc.action?.setEffectiveTimeScale(walking?Math.max(.3,Math.min(1.3,motion.speed/1.15)):1);

}

/* ============================================================
 * 静态几何合并（draw call 优化）
 * 除旗（动画）与 Sprite 标牌外，campus 内所有 Mesh 按材质分组合并；
 * 某组属性不一致合并失败时，回退保留该组原网格（不丢内容）。 */
flag.userData.dynamic = true;
{
  campus.updateMatrixWorld(true);
  const byMat = new Map();                           // 材质 → {geo, src}[]
  const dynamicObjs = [], sprites = [];
  const _m4 = new THREE.Matrix4();
  campus.traverse(o => {
    if (o.userData.dynamic || o.isLight) dynamicObjs.push(o);
    else if (o.isSprite) sprites.push(o);
    else if (o.isMesh) {
      const g = o.geometry.clone().applyMatrix4(_m4.copy(o.matrixWorld));
      const list = byMat.get(o.material) || [];
      list.push({ geo: g, src: o });
      byMat.set(o.material, list);
    }
  });
  campus.clear();
  for (const o of [...dynamicObjs, ...sprites]) campus.add(o);
  let mergedCalls = 0, kept = 0;
  for (const [mat, items] of byMat) {
    const merged = mergeGeometries(items.map(i => i.geo), false);
    if (merged) {
      const m = new THREE.Mesh(merged, mat);
      m.castShadow = !mat.transparent; m.receiveShadow = true;
      campus.add(m); mergedCalls++;
      for (const i of items) i.geo.dispose();
    } else {                                          // 属性不一致 → 保留原网格
      console.warn('[merge] 一组合并失败，按原样保留', mat.name || mat.uuid);
      for (const i of items) { campus.add(i.src); i.geo.dispose(); kept++; }
    }
  }
  window.__campusMerged = mergedCalls;
}

  // 训练/考核等体育流程保持原拖拽瞄准，不进锁定（避免改变已验收手感）。
  if (e.pointerType === 'mouse' && e.isPrimary && document.pointerLockElement !== renderer.domElement
      && !sportsPlay?.active && !sportsPlay?.open && !sportsJourney?.active && !sportsExam?.active) {
    try { renderer.domElement.requestPointerLock()?.catch?.(() => {}); } catch (_) {}

  const isTouch = e.pointerType === 'touch';

    // 指针锁定：读 movementX/Y 增量直改视角（锁定后 clientX/Y 冻结，旧拖拽差值算法失效）
    yaw -= e.movementX * 0.0032;

    joy.dx = Math.max(-1, Math.min(1, (e.clientX - joy.bx) / 46));

const R = 0.45;
function blocked(x, z, py = 0) {
  if(construction?.blocked(x,z,py))return true;
  if (x < -99 || x > 86 || z < -134 || z > 134) return true;   // 校园+主干道活动范围
  const yLo = py + 0.25, yHi = py + 1.55;
  for (const b of collide) if (x > b.minX - R && x < b.maxX + R && z > b.minZ - R && z < b.maxZ + R
    && (b.y1 ?? 6) > yLo && (b.y0 ?? 0) < yHi) return true;
  for (const b of collideSoft) if (x > b.minX - R && x < b.maxX + R && z > b.minZ - R && z < b.maxZ + R) return true;
  return false;
}

function throwBall(strength = 7, power = null) {
  const b = heldBall; if (!b) return;
  b.body.setBodyType(RAPIER.RigidBodyType.Dynamic, true);
  camera.getWorldDirection(_dirV);
  const t = b.body.translation();
  if (power != null && (b.bask || b.socr)) {
    // 蓄力出手：速度/仰角随蓄力；出手带后旋（马格努斯让后旋球打筐前沿被"抬"一下更易滚进）
    const sp = b.bask ? 4.6 + 6.2 * power : 5.0 + 8.0 * power;
    const dir = _dirV.clone();
    dir.y = Math.max(dir.y, b.bask ? 0.42 + 0.28 * power : 0.12 + 0.30 * power);
    dir.normalize();
    b.body.setLinvel({ x: dir.x * sp, y: dir.y * sp, z: dir.z * sp }, true);
    const vh = Math.hypot(dir.x, dir.z) || 1;
    if (b.bask) {
      const spin = 4 + 7 * power;                       // 后旋角速度（rad/s）
      b.body.setAngvel({ x: -dir.z / vh * spin, y: 0, z: dir.x / vh * spin }, true);

    if (!raceRun.npcClipT || t - raceRun.npcClipT > 0.7) { raceRun.npcClipT = t; playClip(npc, 'Run', .25); }

    if (npc._raceClip !== 'Idle') { npc._raceClip = 'Idle'; playClip(npc, 'Idle', .3); }

/* ---------- Worker 执行（真 Python，4 秒熔断防死循环卡死） ---------- */
let pyWorker = null, pyRunSeq = 0, pyWorkerBusy = false;
function pyRunPython(preamble, code, suffix) {
  return new Promise(res => {
    const id = ++pyRunSeq;
    if (pyWorkerBusy) return res({ ok: false, err: 'busy: 请等待本次运行结束' });
    if (!pyWorker) {
      try { pyWorker = new Worker('js/py_worker.js'); }
      catch (e) { return res({ ok: false, err: 'worker-init:' + e.message }); }
    }
    pyWorkerBusy = true;
    const worker = pyWorker;
    const to = setTimeout(() => {
      worker.terminate(); pyWorker = null; pyWorkerBusy = false;              // 死循环：熔断并丢弃 Worker
      res({ timeout: true });
    }, 4000);
    pyWorker.onmessage = ev => { if (ev.data.id !== id) return; clearTimeout(to); pyWorkerBusy = false; res(ev.data); };
    pyWorker.onerror = e => { clearTimeout(to); worker.terminate(); pyWorker = null; pyWorkerBusy = false; res({ ok: false, err: 'worker:' + (e.message || '加载失败') }); };
    pyWorker.postMessage({ id, preamble, code, suffix });
  });
}
function pyTranslateErr(e) {
  const s = String(e);
  if (/is not defined/.test(s)) { const m = s.match(/name ['"]([^'"]+)['"]/); return `变量/函数「${m ? m[1] : '?'}」没定义或打错了——检查拼写和大小写`; }
  if (/ParseError|SyntaxError|invalid syntax|unexpected|EOF|token/i.test(s)) return '语法错误：检查行尾的英文冒号 :、引号 "、括号 ( —— 中文全角符号是最常见原因';
  if (/IndentationError|indented block|unindent|expected an/i.test(s)) return '缩进错误：循环体要向右缩进 4 个空格，同一层要对齐';
  if (/ZeroDivisionError/.test(s)) return '除以 0 了！分母不能为 0';
  if (/TypeError/.test(s)) return '类型错误：数字和字符串不能直接相加';
  if (/worker/.test(s)) return 'Python 引擎加载失败（检查 js/py_worker.js 与 vendor/skulpt/ 是否存在）';
  return '运行出错：' + s.slice(0, 140);
}

  setColliders:boxes=>{if(!physWorld)return;for(const c of constructionPhysics)physWorld.removeCollider(c,true);constructionPhysics.length=0;for(const c of boxes){const h=Math.min(8,c.y1)-(Math.max(0,c.y0));if(h<=0)continue;constructionPhysics.push(physWorld.createCollider(RAPIER.ColliderDesc.cuboid((c.maxX-c.minX)/2,h/2,(c.maxZ-c.minZ)/2).setTranslation((c.minX+c.maxX)/2,Math.max(0,c.y0)+h/2,(c.minZ+c.maxZ)/2)));}},
  ensureSafe:()=>{if(construction&&!construction.isOpenPosition(player.position.x,player.position.z)){player.position.set(-66,0,-57);pvy=0;}for(const npc of npcs){if(construction&&!construction.isOpenPosition(npc.obj.position.x,npc.obj.position.z)){npc.obj.position.x=-24;npc.obj.position.z=-57;npc.target=null;}npc.navigation=null;}},
  refreshMap:()=>{queueMicrotask(()=>{mapPanel.querySelectorAll('[data-construction]').forEach(e=>e.remove());for(const d of construction?.destinations()||[]){const b=document.createElement('button');b.className='dest';b.dataset.construction=d.id;b.dataset.dest=d.name;b.textContent=d.name+(d.open?'':' · 待建设');b.disabled=!d.open;b.style.cssText='font:inherit;color:inherit;background:transparent';mapPanel.querySelector('.destGrid').append(b);}minimapDraw();});},
  study:()=>location.href='classrooms.html',music:on=>{campusMusic.unlock();campusMusic.setScene(on?'celebration':'campus');showToast(on?'舞台配乐已开始，可在配乐设置调整音量':'已返回校园配乐');},pianoSync:b=>campusPiano?.setVisible(b),
  action:type=>{if(type==='study')location.href='classrooms.html';else if(type==='training'||type==='basketball'){sportsPlay.type=type==='basketball'?'basketball':sportsPlay.type;sportsPlay.menu();}else if(type==='swim'){gotoDest('游泳馆');showToast('已到原泳池，靠近计时起点按 E 开始游泳训练');}else if(type==='tennis')showToast('球场与器材已开放，可自由参观。网球比赛暂未开放。');else if(type==='cinema')campusCinema?.openDialog();}
 });
 await construction.ready;
 window.__construction={state:()=>construction.snapshot(),canEnter:(x,z)=>construction.isOpenPosition(x,z),blocked:(x,z,y=0)=>construction.blocked(x,z,y),canWalk:(x,z,y=0)=>!blocked(x,z,y),landscape:()=>structuredClone(constructionLandscape),layout:()=>construction.snapshot().layout};
 try {
  const { CampusPiano } = await import('./js/piano.js');       // 音乐馆真钢琴：attach 按建设档定初始可见，apply() 经 pianoSync 联动
  campusPiano = new CampusPiano({ scene, toast: showToast });
  campusPiano.attach();
  construction.piano = campusPiano;
 } catch (e) { console.error('[piano]', e); showToast('钢琴模块暂不可用，其他功能不受影响'); }
 try {
  const { CampusCinema } = await import('./js/cinema.js');     // 电影馆放映：ensureAttached 自动扫建设根，离馆自动停
  campusCinema = new CampusCinema({ scene, toast: showToast });
  campusCinema.onSit = () => campusCinema.sitMiddle?.();
  campusCinema.sitMiddle = () => {                             // 入座观影：传送到正对银幕的中排座椅（方向键随时起身）
   const s = campusCinema.sitAt(8); if (!s) return;
   player.position.set(s.x, s.y, s.z); yaw = s.yaw === 180 ? Math.PI : 0; camera.rotation.set(-.06, yaw, 0);
   playerPrev.x = s.x; playerPrev.z = s.z; pvy = 0; showToast('已入座观影 · 方向键随时起身');
  };
 } catch (e) { console.error('[cinema]', e); showToast('电影馆模块暂不可用，其他功能不受影响'); }
} catch(error){console.error('[construction]',error);showToast('建设系统暂不可用，原校园课程与体育仍可使用');}

/* ============================================================
 * 四系统（2026-10-14）：真实昼夜 / 天气 / 校园广播 / 音乐馆定时演出
 * 调试参数：?t=21:30 强制时段 · ?weather=rain 强制天气 · ?showtest=1 立即开演
 * ============================================================ */
try {
 const q4 = new URLSearchParams(location.search);
 { // 昼夜（地基）：先建，天气随后以乘法叠加
  const { DayCycle } = await import('./js/daycycle.js');
  const tm = q4.get('t'); let ov = null;
  if (/^\d{1,2}:\d{2}$/.test(tm || '')) { const [hh, mm] = tm.split(':').map(Number); if (hh < 24 && mm < 60) ov = { hour: hh, minute: mm }; }
  daycycle = new DayCycle({ scene, renderer, sun, dynLight, hemi, override: ov });
 }
 { // 天气：晴⇄多云⇄雨 + 雷雨彩蛋；与昼夜乘法叠加，雨天×黄昏同时生效
  const { Weather } = await import('./js/weather.js');
  weather = new Weather({ scene, audio: { rain: l => AU.rain(l), thunder: () => AU.thunder() },
    budget: () => window.__renderBudget?.state() || { mode: 'auto', level: 0 } });
  daycycle.setModifier(b => {                            // 乘法叠加：雨天×黄昏同时生效
    const f = weather.factors();
    b.sunIntensity *= f.sun; b.hemiIntensity *= f.hemi; b.envIntensity *= f.env; b.bgIntensity *= f.bg;
    b.fogNear *= f.fogNear; b.fogFar *= f.fogFar; b.exposure *= f.exposure; b.lamp *= f.lamp;
    return b;
  });
  const wq = q4.get('weather'); if (['sunny', 'cloudy', 'rain'].includes(wq || '')) weather.force(wq);
  window.__weather = { state: () => weather.state(), strike: () => weather.strike() };
  const { WeatherLive } = await import('./js/weather_live.js');   // 江西实时天气（Open-Meteo）：真浏览器默认开，自动化/手动强制自动让位
  weatherLive = new WeatherLive({ weather, toast: showToast }); weatherLive.start();
 }
 { // 广播：真实作息电铃 + 播报员语音变体（同天同条、隔天换措辞）；?bt=07:51:30 注入虚拟时钟（验收）
  const { CampusBroadcast } = await import('./js/broadcast.js');
  const bt = q4.get('bt'); let btBase = null, btPerf0 = 0;
  if (/^\d{1,2}:\d{2}(:\d{2})?$/.test(bt || '')) {
    const p = bt.split(':').map(Number);
    btBase = new Date(); btBase.setHours(p[0], p[1], p[2] || 0, 0); btPerf0 = performance.now();
  }
  broadcast = new CampusBroadcast({ bell: kind => AU.bell(kind), speak: url => AU.speak(url), toast: showToast,
    ...(btBase ? { now: () => new Date(btBase.getTime() + (performance.now() - btPerf0)) } : {}) });
  window.__broadcast = { state: () => broadcast.state(), announce: (t, s) => broadcast.announce(t, s) };
  let prevW = 'sunny';
  weather.onWeatherChange = name => {                    // 天气切换触发对应播报
    if (name === 'rain') broadcast.announce('rainstart');
    else if (prevW === 'rain') broadcast.announce('rainend');
    prevW = name;
  };
  weather.onThunderStart = () => broadcast.announce('thunder');
 }
 { // 音乐馆定时演出：10:30/16:00/20:00 各两首，嵌入歌曲节拍驱动演员
  const { VenueShows } = await import('./js/construction/show.js');
  const announceCard = (text, go) => {                   // 带「前往」按钮的演出预告卡（12s 自动消失）
    const d = document.createElement('div');
    d.style.cssText = 'position:fixed;left:50%;top:22%;transform:translateX(-50%);display:flex;gap:12px;align-items:center;'
      + 'background:rgba(12,18,32,.88);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.18);border-radius:14px;'
      + 'padding:12px 18px;color:#fff;font:600 14px "PingFang SC",sans-serif;z-index:60;white-space:nowrap;';
    d.innerHTML = `<span>🎵 ${text}</span>`;
    const b = document.createElement('button');
    b.textContent = '前往'; b.style.cssText = 'font:inherit;background:#3d7bff;color:#fff;border:none;border-radius:9px;padding:8px 16px;cursor:pointer;';
    b.onclick = () => { go(); d.remove(); };
    d.append(b); document.body.append(d); setTimeout(() => d.remove(), 12000);
  };
  shows = new VenueShows({
    scene, characters: charAssets, campusMusic,
    isBuilt: () => !!construction?.state?.purchases?.music,
    position: () => ({ x: player.position.x, z: player.position.z }),
    notice: showToast,
    onAnnounce: sec => { broadcast.announce('showannounce'); announceCard(`音乐馆演出还有 ${Math.max(1, Math.round(sec / 60))} 分钟开始`, () => gotoDest('音乐馆扩建区')); },
    onShowStart: () => { broadcast.announce('showstart'); const t = shows.nowPlaying?.title; if (t) announceCard(`演出开始 · ${t}`, () => gotoDest('音乐馆扩建区')); },
    onShowEnd: () => broadcast.announce('showend'),
  });
  if (construction) construction.performanceContext = () => shows ? { music: shows.performing, musicRate: shows.pianoRate(), beat: shows.beat() } : null;   // 演员节拍驱动
  if (construction?.programmes) construction.programmes.scheduleInfo = () => {   // 音乐馆面板常驻时刻表
    const d = shows?.describe(); if (!d) return null;
    const box = document.createElement('div'); box.style.cssText = 'margin:10px 0 0;padding:10px 12px;border:1px solid rgba(255,255,255,.14);border-radius:10px;background:rgba(255,255,255,.05);font-size:13px;line-height:1.9';
    const mm = s => `${Math.floor(s / 60)}分${String(s % 60).padStart(2, '0')}秒`;
    box.innerHTML = d.performing && d.nowPlaying
      ? `<b>正在演出</b> · ${d.nowPlaying.title}（第 ${d.nowPlaying.index + 1}/${d.nowPlaying.total} 首）`
      : `<b>演出时刻表</b> ${d.times.join(' / ')}`
        + (d.nextShow ? `<br>下一场 ${d.nextShow} · 还有 ${mm(d.countdownSec)}` : '<br>今日场次已结束，明天见');
    return box;
  };
  window.__shows = { state: () => shows.state(), force: () => shows.forceShow() };
  if (q4.get('showtest') === '1') shows.forceShow();
 }
 { // 生态联动（2026-10-15）：作息清场/避雨调度 + 夜间动物与声景 + 雨天地表；?life=off 关闭
  try {
    const { CampusLife } = await import('./js/campus_life.js');
    campusLife = new CampusLife({
      scene, npcs, daycycle, weather, player, pave: paveMat,
      ambience: (c, f) => AU.nightAmbience(c, f), owl: v => AU.owl(v), bark: v => AU.bark(v),
      meow: v => AU.meow(v), chirp: v => AU.chirp(v), toast: showToast,
      busy: () => !!(sportsPlay?.active || sportsPlay?.open || sportsJourney?.active || sportsExam?.active
        || raceRun.phase || raceSwim.phase || penalty.active),      // 体育/考核接管期冻结调度（防考核 NPC 消失）
      talking: n => n === talkNPC,                                  // 交谈中的 NPC 等聊完再离场
    });
    window.__campusLife = { state: () => campusLife.state() };
  } catch (e) { console.error('[campus-life]', e); showToast('校园生态联动暂不可用，其他功能不受影响'); }
 }
 { // 校园人群（2026-10-17）：晴天课间同学 + 食堂就餐；?crowd=off 关闭（默认真人开/自动化关）
  try {
    const { CampusCrowd } = await import('./js/campus_crowd.js');
    campusCrowd = new CampusCrowd({ scene, characters: charAssets, toast: showToast });
    window.__crowdAU = { clink: v => AU.clink(v) };      // 餐具轻碰音效钩子（AU 合成）
  } catch (e) { console.error('[campus-crowd]', e); showToast('校园人群暂不可用，其他功能不受影响'); }
 }
 window.__sportsAU = { ropeWhoosh: v => AU.ropeWhoosh(v), land: v => AU.land(v), layupJump: v => AU.layupJump(v) };   // 体育表现音效钩子（sports_play 空安全调用）
 { // 时钟 chip：HH:MM + 时段名 + 天气图标（1Hz 刷新）
  const ct = $id('clockTime'), cp = $id('clockPhase');
  const tick = () => {
    const c = daycycle?.snapshot(); if (!c) return;
    ct.textContent = c.clock;
    const w = weather?.state();
    const icon = !w ? '' : w.rainAmount > .5 ? ' · 🌧️' : (w.target === 'cloudy' ? ' · ⛅' : ' · ☀️');
    cp.textContent = c.phaseLabel + icon;
  };
  tick(); setInterval(tick, 1000);
 }
} catch (e) { console.error('[four-systems]', e); showToast('昼夜/天气/广播系统暂不可用，校园其他功能不受影响'); }
